name: One-shot address bar fix

on:
  push:
    branches:
      - rebuild/121e47b-four-pillars
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'address bar IME refactor') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/121e47b-four-pillars
          fetch-depth: 0
      - name: Apply narrowly scoped patch
        shell: python
        run: |
          from pathlib import Path
          bc = Path('app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt')
          text = bc.read_text(encoding='utf-8')
          old_import = 'import androidx.compose.ui.focus.focusRequester\n'
          new_import = old_import + 'import androidx.compose.ui.focus.focusProperties\nimport androidx.compose.ui.input.pointer.pointerInput\n'
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)
          old_effect = '''    LaunchedEffect(isEditing) {\n        if (isEditing) {\n            // URL バーをタップしても全選択せず、カーソルを末尾に置く。\n            if (textFieldValue.text != value) textFieldValue = TextFieldValue(value, TextRange(value.length))\n            focusRequester.requestFocus()\n        } else {\n            focusManager.clearFocus(force = true)\n            keyboardController?.hide()\n        }\n    }\n'''
          new_effect = '''    LaunchedEffect(isEditing) {\n        if (isEditing) {\n            // プログラムから編集開始された場合だけ明示的にフォーカスを要求する。\n            if (textFieldValue.text != value) textFieldValue = TextFieldValue(value, TextRange(value.length))\n            focusRequester.requestFocus()\n        }\n    }\n'''
          assert text.count(old_effect) == 1
          text = text.replace(old_effect, new_effect, 1)
          old_trailing = '''                        if (textFieldValue.text.isNotBlank()) {\n                            IconButton(onClick = { onValueChange(\"\") }, modifier = Modifier.size(32.dp)) {\n                                Icon(Icons.Default.Close, contentDescription = \"入力を消去\", modifier = Modifier.size(18.dp), tint = Color.White)\n                            }\n                        }\n'''
          new_trailing = '''                        if (textFieldValue.text.isNotBlank()) {\n                            Box(\n                                modifier = Modifier\n                                    .size(32.dp)\n                                    .focusProperties { canFocus = false }\n                                    .pointerInput(Unit) {\n                                        awaitPointerEventScope {\n                                            while (true) {\n                                                val event = awaitPointerEvent()\n                                                if (event.changes.any { it.changedToUp() }) {\n                                                    event.changes.forEach { it.consume() }\n                                                    onValueChange(\"\")\n                                                    break\n                                                }\n                                            }\n                                        }\n                                    },\n                                contentAlignment = Alignment.Center\n                            ) {\n                                Icon(Icons.Default.Close, contentDescription = \"入力を消去\", modifier = Modifier.size(18.dp), tint = Color.White)\n                            }\n                        }\n'''
          assert text.count(old_trailing) == 1
          text = text.replace(old_trailing, new_trailing, 1)
          bc.write_text(text, encoding='utf-8')
      - name: Compile
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Verify scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt "
          test -z "$(git diff --name-only -- app/src/main/java/com/example/httpsbrowser/web app/src/main/java/com/example/httpsbrowser/data)"
      - name: Commit verified patch and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/one-shot-addressbar-fix.yml
          git add app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt .github/workflows/one-shot-addressbar-fix.yml
          git commit -m 'refactor: address bar IME refactor'
          git push origin HEAD:rebuild/121e47b-four-pillars
