name: Apply targeted address bar clear fix

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Patch address bar clear semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controls = Path('app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt')
          s = controls.read_text()
          s = s.replace(
              '    onValueChange: (String) -> Unit,\n    onSubmit: () -> Unit,',
              '    onValueChange: (String) -> Unit,\n    onClear: () -> Unit,\n    onSubmit: () -> Unit,',
              1,
          )
          old = 'IconButton(onClick = { onValueChange("") }, modifier = Modifier.size(32.dp)) {'
          new = 'IconButton(onClick = onClear, modifier = Modifier.size(32.dp)) {'
          if old not in s:
              raise SystemExit('AddressBar clear button not found')
          s = s.replace(old, new, 1)
          controls.write_text(s)

          vm = Path('app/src/main/java/com/example/httpsbrowser/ui/BrowserViewModel.kt')
          s = vm.read_text()
          marker = '''    fun stopAddressEditing() {
        suggestionJob?.cancel()
        val tab = uiState.selectedTab ?: return
        uiState = uiState.copy(
            addressInput = if (tab.isHome) "" else tab.displayText.ifBlank { tab.url },
            isAddressFocused = false,
            isSuggestionPanelVisible = false,
            suggestions = emptyList()
        )
    }
'''
          method = marker + '''
    /** Clear the address bar without changing whether the user is currently editing it. */
    fun clearAddressInput() {
        suggestionJob?.cancel()
        uiState = uiState.copy(
            addressInput = "",
            isSuggestionPanelVisible = false,
            suggestions = emptyList()
        )
    }
'''
          if marker not in s:
              raise SystemExit('stopAddressEditing marker not found')
          s = s.replace(marker, method, 1)
          vm.write_text(s)

          screen = Path('app/src/main/java/com/example/httpsbrowser/ui/BrowserScreen.kt')
          s = screen.read_text()
          old = '''                        onValueChange = viewModel::setAddressInput,
                        // 新規入力時だけURLを読み込む。WebViewの戻る・進むではloadUrlを呼ばない。
'''
          new = '''                        onValueChange = viewModel::setAddressInput,
                        // Xは「入力を消す」だけ。未選択時に編集状態へ遷移させない。
                        onClear = viewModel::clearAddressInput,
                        // 新規入力時だけURLを読み込む。WebViewの戻る・進むではloadUrlを呼ばない。
'''
          if old not in s:
              raise SystemExit('BrowserScreen AddressBar call not found')
          s = s.replace(old, new, 1)
          screen.write_text(s)
          PY

      - name: Verify targeted state transition
        run: |
          grep -n "onClear = viewModel::clearAddressInput" app/src/main/java/com/example/httpsbrowser/ui/BrowserScreen.kt
          grep -n "fun clearAddressInput" app/src/main/java/com/example/httpsbrowser/ui/BrowserViewModel.kt
          grep -n "IconButton(onClick = onClear" app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-ime-fix-v2.yml .ime-fix-v2-trigger
          git add app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt app/src/main/java/com/example/httpsbrowser/ui/BrowserScreen.kt app/src/main/java/com/example/httpsbrowser/ui/BrowserViewModel.kt
          git commit -m "fix(address-bar): clear input without stealing focus"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}