name: One-shot address clean

on:
  push:
    branches:
      - fix/address-bar-clean-96

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'aaaaaisss' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/address-bar-clean-96
          fetch-depth: 0
      - name: Apply final refactor
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          def read(p): return Path(p).read_text()
          def write(p, s): Path(p).write_text(s)
          def replace_once(p, old, new):
              s = read(p)
              if old not in s:
                  raise SystemExit(f'anchor missing in {p}: {old[:160]!r}')
              write(p, s.replace(old, new, 1))

          # ---------------- BrowserControls ----------------
          p = 'app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt'
          s = read(p)
          old = '''    LaunchedEffect(isEditing) {
          if (isEditing) {
              // URL バーをタップしても全選択せず、カーソルを末尾に置く。
              if (textFieldValue.text != value) textFieldValue = TextFieldValue(value, TextRange(value.length))
              focusRequester.requestFocus()
          } else {
              focusManager.clearFocus(force = true)
              keyboardController?.hide()
          }
      }
'''
          new = '''    // Focus/IMEはユーザー操作の結果だけで変化させる。編集状態の再構成を
    // 監視してrequestFocus()/hide()する循環は作らない。
'''
          if old not in s:
              raise SystemExit('AddressBar editing effect anchor missing')
          s = s.replace(old, new, 1)

          old = '''                    .focusRequester(focusRequester).onFocusChanged { focus ->
                        if (focus.isFocused && !isEditing) onEditingStarted()
                        // IMEを閉じた端末でも、ホームの空白部や他の操作でフォーカスが外れれば
                        // 編集状態を必ず終了し、下部の操作列・タブバーを復帰する。
                        if (!focus.isFocused && isEditing) onEditingStopped()
                    },
'''
          new = '''                    .focusRequester(focusRequester).onFocusChanged { focus ->
                        if (focus.isFocused) {
                            textFieldValue = textFieldValue.copy(
                                selection = TextRange(textFieldValue.text.length),
                                composition = null
                            )
                            if (!isEditing) onEditingStarted()
                        } else if (isEditing) {
                            // 実際のFocus lossは編集終了イベントだけ通知する。IMEの手動消去は
                            // BrowserScreen側の編集状態を勝手に終了させない。
                            onEditingStopped()
                        }
                    },
'''
          if old not in s:
              raise SystemExit('AddressBar focus anchor missing')
          s = s.replace(old, new, 1)

          old = '''                keyboardActions = KeyboardActions(onSearch = {
                    // IMEの検索確定直後にWebViewへフォーカスが移っても、端末差でキーボードが
                    // 残らないよう先に明示的に閉じる。ViewModel側も候補・編集状態を同時に終了する。
                    keyboardController?.hide()
                    focusManager.clearFocus(force = true)
                    onSubmit(textFieldValue.text)
                }),
'''
          new = '''                keyboardActions = KeyboardActions(onSearch = {
                    onSubmit(textFieldValue.text)
                }),
'''
          if old not in s:
              raise SystemExit('AddressBar IME submit anchor missing')
          s = s.replace(old, new, 1)

          old = '''                            IconButton(onClick = {
                                onValueChange("")
                                onEditingStarted()
                            }, modifier = Modifier.size(32.dp)) {
'''
          new = '''                            IconButton(onClick = {
                                textFieldValue = TextFieldValue("")
                                onValueChange("")
                                // Xは文字列だけを消す。編集中なら現在のFocus/IMEを維持し、
                                // 非編集中ならFocus/IMEには触れない。
                            }, modifier = Modifier.size(32.dp)) {
'''
          if old not in s:
              raise SystemExit('AddressBar X anchor missing')
          s = s.replace(old, new, 1)
          write(p, s)

          # ---------------- BrowserScreen ----------------
          p = 'app/src/main/java/com/example/httpsbrowser/ui/BrowserScreen.kt'
          s = read(p)
          for line in [
              'import android.graphics.Rect\\n',
              'import android.view.ViewTreeObserver\\n',
              'import androidx.compose.foundation.layout.isImeVisible\\n',
              'import androidx.compose.ui.platform.LocalView\\n'
          ]:
              s = s.replace(line.replace('\\\\n','\\n'), '')

          old = '    val rootView = LocalView.current\\n'.replace('\\\\n','\\n')
          s = s.replace(old, '')

          marker = '    var pendingDownload by remember { mutableStateOf<BrowserDownloadRequest?>(null) }\\n'.replace('\\\\n','\\n')
          addition = marker + '    var addressBarFocused by remember { mutableStateOf(false) }\\n    val addressBarFocusRequester = remember { androidx.compose.ui.focus.FocusRequester() }\\n'
          if marker not in s:
              raise SystemExit('BrowserScreen state marker missing')
          s = s.replace(marker, addition, 1)

          # Delete both state-driven IME observers, including the ViewTreeObserver fallback.
          s = re.sub(r'\\n    LaunchedEffect\(state\.isAddressFocused\) \{.*?\\n    \}\\n    // Androidの戻る・IME閉じる操作を検知.*?DisposableEffect\(rootView\) \{.*?\\n    \}\\n', '\\n', s, flags=re.S)

          # Replace the direct navigation-end helper with a UI-owned focus/IME helper.
          old = '''    fun endAddressEditing() {
        keyboardController?.hide()
        focusManager.clearFocus(force = true)
        viewModel.stopAddressEditing()
    }
'''
          new = '''    fun endAddressEditing() {
        keyboardController?.hide()
        focusManager.clearFocus(force = true)
        addressBarFocused = false
        viewModel.stopAddressEditing()
    }
'''
          if old not in s:
              raise SystemExit('endAddressEditing anchor missing')
          s = s.replace(old, new, 1)

          s = s.replace('state.isAddressFocused', 'addressBarFocused')

          # Back must use the UI-owned focus state.
          s = s.replace('''            addressBarFocused -> viewModel.stopAddressEditing()
''', '''            addressBarFocused -> endAddressEditing()
''', 1)

          # AddressBar call: latest IME text comes directly from the text field, and focus is UI-owned.
          old = '''                    AddressBar(
                        value = state.addressInput,
                        progress = progress,
                        isEditing = addressBarFocused,
                        onValueChange = viewModel::setAddressInput,
                        // 新規入力時だけURLを読み込む。WebViewの戻る・進むではloadUrlを呼ばない。
                        onSubmit = { input -> navigate(input) },
                        onTranslate = { if (!selectedTab.isHome) registry.translateToJapanese(selectedTab.id) },
                        onRefresh = { if (!selectedTab.isHome) registry.reload(selectedTab.id) },
                        onEditingStarted = viewModel::startAddressEditing,
                        onEditingStopped = viewModel::stopAddressEditing
                    )
'''
          new = '''                    AddressBar(
                        value = state.addressInput,
                        progress = progress,
                        isEditing = addressBarFocused,
                        focusRequester = addressBarFocusRequester,
                        onValueChange = viewModel::setAddressInput,
                        // 新規入力時だけURLを読み込む。IMEではTextFieldの最新文字列を直接受け取る。
                        onSubmit = { input -> navigate(input) },
                        onTranslate = { endAddressEditing(); if (!selectedTab.isHome) registry.translateToJapanese(selectedTab.id) },
                        onRefresh = { endAddressEditing(); if (!selectedTab.isHome) registry.reload(selectedTab.id) },
                        onEditingStarted = { addressBarFocused = true; viewModel.startAddressEditing() },
                        onEditingStopped = { addressBarFocused = false; viewModel.stopAddressEditing() }
                    )
'''
          if old not in s:
              raise SystemExit('BrowserScreen AddressBar call anchor missing')
          s = s.replace(old, new, 1)

          s = s.replace('onSearch = viewModel::startAddressEditing,', 'onSearch = { addressBarFocusRequester.requestFocus() },', 1)

          # WebView interaction ends address editing through the UI helper instead of mutating focus state only in VM.
          old = '    override fun onPageInteraction() = viewModel.stopAddressEditing()\\n'.replace('\\\\n','\\n')
          new = '    override fun onPageInteraction() = Unit\\n'.replace('\\\\n','\\n')
          if old not in s:
              raise SystemExit('callbacks onPageInteraction anchor missing')
          s = s.replace(old, new, 1)

          # The callback object needs a UI-owned function for page interaction. Add it to callbacksFor and use it above.
          s = s.replace('''    onPageArchiveReady: (String, String) -> Unit
) = object : BrowserWebCallbacks {
''', '''    onPageArchiveReady: (String, String) -> Unit,
    onPageInteraction: () -> Unit
) = object : BrowserWebCallbacks {
''', 1)
          s = s.replace('override fun onPageInteraction() = Unit', 'override fun onPageInteraction() = onPageInteraction()', 1)
          # Pass the helper at both callback construction sites.
          s = s.replace('''                onPageArchiveReady = { sourcePath, fileName ->
                    pendingPageArchive = File(sourcePath)
                    pageArchiveLauncher.launch(fileName)
                }
            ))
''', '''                onPageArchiveReady = { sourcePath, fileName ->
                    pendingPageArchive = File(sourcePath)
                    pageArchiveLauncher.launch(fileName)
                },
                onPageInteraction = ::endAddressEditing
            ))
''', 1)
          # second occurrence
          s = s.replace('''                onPageArchiveReady = { sourcePath, fileName ->
                    pendingPageArchive = File(sourcePath)
                    pageArchiveLauncher.launch(fileName)
                }
            ))
''', '''                onPageArchiveReady = { sourcePath, fileName ->
                    pendingPageArchive = File(sourcePath)
                    pageArchiveLauncher.launch(fileName)
                },
                onPageInteraction = ::endAddressEditing
            ))
''', 1)

          # Any direct stopAddressEditing in UI action handlers should go through the UI helper.
          s = s.replace('viewModel.stopAddressEditing();', 'endAddressEditing();')
          s = s.replace('viewModel.stopAddressEditing()\n', 'endAddressEditing()\n')
          # BrowserVM calls that are legitimate inside callback definitions must remain untouched only outside UI handlers.
          s = s.replace('fun endAddressEditing() {\n        keyboardController?.hide()\n        focusManager.clearFocus(force = true)\n        addressBarFocused = false\n        endAddressEditing()\n    }', 'fun endAddressEditing() {\n        keyboardController?.hide()\n        focusManager.clearFocus(force = true)\n        addressBarFocused = false\n        viewModel.stopAddressEditing()\n    }')
          write(p, s)

          # AddressBar signature now accepts the UI-owned FocusRequester.
          p = 'app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt'
          s = read(p)
          old = '''    onSubmit: (String) -> Unit,
    onTranslate: () -> Unit,
'''
          new = '''    onSubmit: (String) -> Unit,
    focusRequester: FocusRequester,
    onTranslate: () -> Unit,
'''
          if old not in s:
              raise SystemExit('AddressBar signature anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('    val focusRequester = remember { FocusRequester() }\n', '')
          write(p, s)

          # ---------------- BrowserWebView UI-thread boundary ----------------
          p = 'app/src/main/java/com/example/httpsbrowser/web/BrowserWebView.kt'
          s = read(p)
          if 'import android.os.Looper\n' not in s:
              s = s.replace('import android.os.Build\n', 'import android.os.Build\nimport android.os.Looper\n', 1)
          marker = '    private val entries = ConcurrentHashMap<String, Entry>()\n\n'
          helper = marker + '''    private fun assertUiThread() {
        check(Looper.myLooper() == Looper.getMainLooper()) {
            "BrowserWebViewRegistry WebView access must run on the UI thread"
        }
    }

'''
          if marker not in s:
              raise SystemExit('Registry class marker missing')
          s = s.replace(marker, helper, 1)

          signatures = [
              'fun obtain(tab: BrowserTab, settings: BrowserSettings, callbacks: BrowserWebCallbacks): WebView {',
              'fun refreshContentFiltering() {',
              'fun load(tabId: String, url: String) {',
              'fun reload(tabId: String) = entries[tabId]?.let { entry ->',
              'fun goBack(tabId: String) = entries[tabId]?.let { entry ->',
              'fun canGoBack(tabId: String): Boolean = entries[tabId]?.webView?.let { view ->',
              'fun setFullscreenVideoDarkeningSuppressed(tabId: String, suppressed: Boolean) {',
              'fun resetForHome(tabId: String) {',
              'fun currentUrl(tabId: String): String? = entries[tabId]?.let { entry ->',
              'fun translateToJapanese(tabId: String) = entries[tabId]?.let { entry ->',
              'fun savePageArchive(tabId: String, title: String) = entries[tabId]?.let { entry ->',
              'fun goForward(tabId: String) = entries[tabId]?.let { entry ->',
              'fun scrollBy(tabId: String, deltaY: Int) =',
              'fun scrollToTop(tabId: String) =',
              'fun scrollToBottom(tabId: String) =',
              'fun scrollToFraction(tabId: String, fraction: Float) =',
              'fun pause(tabId: String) =',
              'fun resume(tabId: String) =',
              'fun remove(tabId: String) {',
              'fun destroyAll() {',
              'fun close() {',
              'fun clearAllBrowsingData() {'
          ]
          for sig in signatures:
              if sig not in s:
                  raise SystemExit(f'Registry signature missing: {sig}')
              s = s.replace(sig, sig + '\n        assertUiThread()', 1)

          # Attach/detach are direct ViewGroup/WebView operations too.
          s = s.replace('''    fun attachToNativeHost(tabId: String, host: ViewGroup): Boolean {
        val view = entries[tabId]?.webView ?: return false
''', '''    fun attachToNativeHost(tabId: String, host: ViewGroup): Boolean {
        assertUiThread()
        val view = entries[tabId]?.webView ?: return false
''', 1)
          s = s.replace('''    fun detachFromNativeHost(tabId: String, host: ViewGroup? = null) {
        val view = entries[tabId]?.webView ?: return
''', '''    fun detachFromNativeHost(tabId: String, host: ViewGroup? = null) {
        assertUiThread()
        val view = entries[tabId]?.webView ?: return
''', 1)
          write(p, s)

          # No accidental state-driven focus/IME machinery remains in the edited UI.
          for p in [
              'app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt',
              'app/src/main/java/com/example/httpsbrowser/ui/BrowserScreen.kt'
          ]:
              text = read(p)
              if 'LaunchedEffect(isEditing)' in text or 'LaunchedEffect(state.isAddressFocused)' in text:
                  raise SystemExit(f'state-driven focus effect remains in {p}')
              if 'ViewTreeObserver.OnGlobalLayoutListener' in text or 'WindowInsets.isImeVisible' in text:
                  raise SystemExit(f'IME global observer remains in {p}')

          # Check formatting/patch sanity before committing.
          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','status','--short'], check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt','app/src/main/java/com/example/httpsbrowser/ui/BrowserScreen.kt','app/src/main/java/com/example/httpsbrowser/web/BrowserWebView.kt','.github/workflows/one-shot-address-clean.yml'], check=True)
          subprocess.run(['git','rm','.github/workflows/one-shot-address-clean.yml'], check=True)
          subprocess.run(['git','commit','-m','refactor: separate address editing from focus and guard webview thread'], check=True)
          subprocess.run(['git','push','origin','HEAD:fix/address-bar-clean-96'], check=True)
