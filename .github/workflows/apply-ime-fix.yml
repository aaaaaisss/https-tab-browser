name: Apply address bar IME race fix

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Patch address bar focus and IME handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt')
          s = p.read_text()
          pattern = re.compile(r'''(?P<prefix>\.focusRequester\(focusRequester\)\.onFocusChanged \{ focus ->\n\s*if \(focus\.isFocused && !isEditing\) onEditingStarted\(\)\n)(?P<old>\s*//.*?\n\s*//.*?\n\s*if \(!focus\.isFocused && isEditing\) onEditingStopped\(\)\n)(?P<suffix>\s*\},)''', re.S)
          s, count = pattern.subn(r'''\g<prefix>                        // フォーカス喪失だけでは編集状態を終了しない。\n                        // XボタンやIMEの一時的なフォーカス遷移でstopAddressEditing()が走ると、\n                        // IMEが一瞬だけ表示されて消えるため、明示的な編集終了だけで閉じる。\n\g<suffix>''', s, count=1)
          if count != 1:
              raise SystemExit(f'focus block replacement count={count}')

          clear = re.compile(r'''IconButton\(onClick = \{\s*onValueChange\(""\)\s*onEditingStarted\(\)\s*\}, modifier = Modifier\.size\(32\.dp\)\) \{''')
          replacement = '''IconButton(onClick = {
                                onEditingStarted()
                                onValueChange("")
                                focusRequester.requestFocus()
                                keyboardController?.show()
                            }, modifier = Modifier.size(32.dp)) {'''
          s, count = clear.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'clear button replacement count={count}')
          p.write_text(s)

          p = Path('app/src/main/java/com/example/httpsbrowser/ui/BrowserScreen.kt')
          s = p.read_text()
          start = s.find('    // Androidの戻る・IME閉じる操作を検知し、URLバーだけが編集状態に残って候補が居座る不具合を防ぐ。')
          if start < 0:
              raise SystemExit('BrowserScreen IME observer start not found')
          end = s.find('    LaunchedEffect(state.bookmarks) {', start)
          if end < 0:
              raise SystemExit('BrowserScreen IME observer end not found')
          s = s[:start] + s[end:]
          p.write_text(s)
          PY

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/httpsbrowser/ui/BrowserControls.kt app/src/main/java/com/example/httpsbrowser/ui/BrowserScreen.kt
          git commit -m "fix(address-bar): decouple IME visibility from editing state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
